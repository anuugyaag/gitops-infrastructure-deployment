name: GitOps Infrastructure Deployment

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Initialize
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

  terraform-apply:
    name: Approved Infrastructure Apply
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Approval Confirmed
        run: echo "Manual approval received. Infrastructure apply stage is authorized."

      - name: Apply Stage
        run: echo "Apply stage completed. No real AWS infrastructure was modified."
